# The two dashboards of docs/grafana, copied (with their data source ids filled in) to /var/lib/grafana/dashboards by the entry point of the service.
apiVersion: 1
providers:
  - name: veritmo
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
