# Veritmo as one Compose file: the server and everything it works with.
#
#   bash scripts/compose-init.sh                  # makes .env with generated secrets and checks Docker and the NVIDIA runtime
#   docker compose --profile install run --rm installer     # installs the programs into the host folders (once)
#   docker compose up -d                          # the server, its MySQL, the migration, Prometheus and Grafana
#   docker compose --profile music up -d          # ... and the two music generators (profiles: music, local-llm, logs, redis)
#
# What lives where: every folder of FILES (projects, library, models, voices, keys and token, the installed programs, the HyperFrames blocks) is a
# folder of this machine, chosen in .env and mounted into the containers; only the database and the data of Prometheus and Loki are Docker
# volumes. Nothing the person installs or creates is in an image.
#
# What the stack leaves out: the dashboard (dashboards-lab), a separate project that connects to the server from outside (give it the address of the
# server and its token: docs/COMPOSE.md), and a container for the .NET services (the recognition of songs and the vision of the video-edit tools): the
# server runs those itself, as programs of the installation folder, and where that folder has none the tasks that need them are reported unavailable,
# with their reason. The installer step of the public edition does not build them.
#
# Every piece starts already pointing at the others (see the `environment` of the server): nothing is typed in a screen. docs/COMPOSE.md has the rest.

name: veritmo

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

# The user every service that writes to a host folder runs as, so that nothing in them ends up owned by root.
x-user: &user "${UID:-1000}:${GID:-1000}"

# What the stack cannot start without: a variable that is empty or missing stops `docker compose up` before anything starts, naming it. The example
# environment has these empty on purpose; scripts/compose-init.sh fills them with generated values.
x-required:
  mysql_root_password: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env (bash scripts/compose-init.sh makes it)}
  veritmo_db_password: ${VERITMO_DB_PASSWORD:?set VERITMO_DB_PASSWORD in .env (bash scripts/compose-init.sh makes it)}
  grafana_db_password: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env (bash scripts/compose-init.sh makes it)}
  grafana_ro_password: ${GRAFANA_RO_PASSWORD:?set GRAFANA_RO_PASSWORD in .env (bash scripts/compose-init.sh makes it)}
  grafana_admin_password: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env (bash scripts/compose-init.sh makes it)}
  music_token: ${MUSIC_TOKEN:?set MUSIC_TOKEN in .env (bash scripts/compose-init.sh makes it)}
  redis_password: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (bash scripts/compose-init.sh makes it)}
  veritmo_token: ${VERITMO_TOKEN:?set VERITMO_TOKEN in .env (bash scripts/compose-init.sh makes it)}

x-server-image: &server-image
  # The public edition pulls the published image and builds it only when it cannot (Compose tries the pull first, then `build:`); the private one
  # is always built here, with its own build tag, and must never be replaced by the public image.
  image: ghcr.io/privadosia/veritmo-server:${VERSION:-latest}
  build:
    context: .
    target: runtime
    args:
      EDITION_TAG: ${EDITION_TAG:-}
      VERSION: ${VERSION:-dev}

x-database-env: &database-env
  VERITMO_DB_DRIVER: mysql
  VERITMO_DB_HOST: mysql
  VERITMO_DB_PORT: "3306"
  VERITMO_DB_NAME: ${VERITMO_DB_NAME:-veritmo}
  VERITMO_DB_USER: ${VERITMO_DB_USER:-veritmo}
  VERITMO_DB_PASSWORD_FILE: /run/secrets/veritmo_db_password

services:
  # ─── The database: the one database server of the stack ─────────────────
  mysql:
    image: mysql:8.4
    restart: "no"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: ${VERITMO_DB_NAME:-veritmo}
      MYSQL_USER: ${VERITMO_DB_USER:-veritmo}
      MYSQL_PASSWORD_FILE: /run/secrets/veritmo_db_password
    secrets: [mysql_root_password, veritmo_db_password]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$(cat /run/secrets/mysql_root_password)\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    security_opt: ["no-new-privileges:true"]

  # Grafana's own schema and its read-only user on the whole schema of the server, created (and their passwords updated) from .env on every start.
  # Neither needs a table to exist, so this does not wait for the migration.
  mysql-users:
    image: mysql:8.4
    restart: "no"
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      VERITMO_DB_NAME: ${VERITMO_DB_NAME:-veritmo}
    secrets: [mysql_root_password, grafana_db_password, grafana_ro_password]
    volumes:
      - ./deploy/compose/mysql/users.sh:/users.sh:ro
    entrypoint: ["sh", "/users.sh"]

  # The migration of the schema: the deployment of what the data layer asks for. The server starts only when it ended well and never migrates itself.
  migrate:
    <<: *server-image
    restart: "no"
    user: *user
    command: ["data", "migrate"]
    depends_on:
      mysql: {condition: service_healthy}
    environment: *database-env
    secrets: [veritmo_db_password]
    volumes:
      - ${CONFIG_PATH:-./compose-data/config}:/config/veritmo

  # ─── The server ─────────────────────────────────────────────────────────
  server:
    <<: [*server-image, *gpu]
    restart: "no"
    user: *user
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      <<: *database-env
      VERITMO_TOKEN_FILE: /run/secrets/veritmo_token
      SERVER_ARGS: ${SERVER_ARGS:-}
      # The browser origin of the dashboard (it runs outside the stack) and the pieces of the stack, as the default of what is not saved in Settings.
      CORS_ORIGINS: ${DASHBOARD_ORIGIN:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      HEARTMULA_HOST: http://heartmula:8787
      HEARTMULA_TOKEN_FILE: /run/secrets/music_token
      DIFFRHYTHM2_HOST: http://diffrhythm2:8788
      DIFFRHYTHM2_TOKEN_FILE: /run/secrets/music_token
      MODEL3D_HOST: http://model3d:8790
      MODEL3D_TOKEN_FILE: /run/secrets/music_token
      MONITORING_PROMETHEUS_ADDRESS: http://prometheus:9090
      MONITORING_GRAFANA_ADDRESS: http://grafana:3000
      MONITORING_GRAFANA_USER: admin
      MONITORING_GRAFANA_SECRET_FILE: /run/secrets/grafana_admin_password
      MONITORING_LOKI_ADDRESS: http://loki:3100
      MONITORING_REDIS_ADDRESS: redis:6379
      MONITORING_REDIS_SECRET_FILE: /run/secrets/redis_password
      MEDIA_DIR: ${MEDIA_DIR:-}
    secrets: [veritmo_db_password, veritmo_token, music_token, grafana_admin_password, redis_password]
    ports:
      - "${BIND:-127.0.0.1}:${SERVER_PORT:-4666}:4666"
    volumes:
      - ${PROJECTS_PATH:-./compose-data/projects}:/app/projects
      - ${MEDIA_PATH:-./compose-data/media}:/media
      - ${MODELS_PATH:-./compose-data/models}:/app/models
      - ${VOICES_PATH:-./compose-data/voices}:/app/voices
      - ${HYPERFRAMES_PATH:-./compose-data/hyperframes}:/app/hyperframes
      - ${INSTALL_PATH:-./compose-data/install}/bin:/app/bin
      - ${INSTALL_PATH:-./compose-data/install}/third_party:/app/third_party
      - ${CONFIG_PATH:-./compose-data/config}:/config/veritmo
    tmpfs:
      - /app/.orchestrator
      # with exec: yt-dlp unpacks itself here and runs from it
      - /tmp:exec,mode=1777
    mem_limit: ${SERVER_MEM_LIMIT:-48g}
    shm_size: 2g
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4666/api/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    security_opt: ["no-new-privileges:true"]

  # ─── The installation step ──────────────────────────────────────────────
  # Runs the pinned install scripts of the repository in an image with the build chain and writes what they build or download into the host folders,
  # so the programs run in the image of the server. Repeatable: what is installed is not built again.
  #   docker compose --profile install run --rm installer          # install what is missing
  #   docker compose --profile install run --rm installer check    # only say what is installed and what is missing
  # INSTALL_COMPONENTS (in .env) chooses the components; see deploy/compose/install.sh. It has the graphics card so that sd is built for the card of this
  # machine (without it the CUDA build cannot detect the architecture and falls back to a generic one).
  installer:
    <<: *gpu
    profiles: [install]
    image: ghcr.io/privadosia/veritmo-tools:${VERSION:-latest}
    build:
      context: .
      target: tools
      args:
        VERSION: ${VERSION:-dev}
    restart: "no"
    user: *user
    environment:
      INSTALL_COMPONENTS: ${INSTALL_COMPONENTS:-}
      HOME: /tmp/home
    tmpfs:
      # with exec: the build tools it downloads (esbuild, the .NET host) are programs run from here
      - /tmp:exec,mode=1777
    volumes:
      - ${INSTALL_PATH:-./compose-data/install}/bin:/app/bin
      - ${INSTALL_PATH:-./compose-data/install}/third_party:/app/third_party
      - ${MODELS_PATH:-./compose-data/models}:/app/models
      - ${VOICES_PATH:-./compose-data/voices}:/app/voices
      - ${HYPERFRAMES_PATH:-./compose-data/hyperframes}:/app/hyperframes

  # ─── Profile `music`: the two song generators ───────────────────────────
  # The Python services of docker/, with the same HTTP contract as the .NET ones. The weights are not in the images: they are folders of this machine
  # (MODELS_PATH/music/<engine>), mounted read-only. The server finds them by their address in the environment (HEARTMULA_HOST, DIFFRHYTHM2_HOST).
  #   docker compose --profile music-weights run --rm heartmula-weights       # about 21 GB, once
  #   docker compose --profile music-weights run --rm diffrhythm2-weights     # about 9.5 GB, once
  # Each takes the card HEARTMULA_GPU / DIFFRHYTHM2_GPU (0 by default): with two cards, give each its own.
  heartmula:
    profiles: [music]
    image: veritmo/heartmula:${VERSION:-dev}
    build:
      context: ./docker/heartmula
    restart: "no"
    user: *user
    environment:
      HEARTMULA_TOKEN_FILE: /run/secrets/music_token
      HOME: /tmp
      # the user of the host has no entry in the image's passwd and torch asks for the user's name
      USER: app
    secrets: [music_token]
    volumes:
      - ${MODELS_PATH:-./compose-data/models}/music/heartmula:/ckpt:ro
    tmpfs:
      # the library compiles parts of the model with a C compiler into /tmp, which needs exec
      - /tmp:exec,mode=1777
    shm_size: 1g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${HEARTMULA_GPU:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; r = u.Request('http://127.0.0.1:8787/health', headers={'Authorization': 'Bearer ' + open('/run/secrets/music_token').read().strip()}); import sys; sys.exit(0 if u.urlopen(r, timeout=4).status == 200 else 1)"]
      interval: 20s
      timeout: 6s
      retries: 10
      start_period: 120s
    security_opt: ["no-new-privileges:true"]

  diffrhythm2:
    profiles: [music]
    image: veritmo/diffrhythm2:${VERSION:-dev}
    build:
      context: ./docker/diffrhythm2
    restart: "no"
    user: *user
    environment:
      DIFFRHYTHM2_TOKEN_FILE: /run/secrets/music_token
      HOME: /tmp
      # the user of the host has no entry in the image's passwd and torch asks for the user's name
      USER: app
    secrets: [music_token]
    volumes:
      - ${MODELS_PATH:-./compose-data/models}/music/diffrhythm2:/ckpt:ro
    tmpfs:
      - /tmp:exec,mode=1777
    shm_size: 1g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${DIFFRHYTHM2_GPU:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; r = u.Request('http://127.0.0.1:8788/health', headers={'Authorization': 'Bearer ' + open('/run/secrets/music_token').read().strip()}); import sys; sys.exit(0 if u.urlopen(r, timeout=4).status == 200 else 1)"]
      interval: 20s
      timeout: 6s
      retries: 10
      start_period: 120s
    security_opt: ["no-new-privileges:true"]

  # The one-shot downloads of the weights (profile `music-weights`): the only thing of these images that touches the network, and they run on request.
  heartmula-weights:
    profiles: [music-weights]
    image: veritmo/heartmula:${VERSION:-dev}
    user: *user
    environment: {HOME: /tmp}
    entrypoint: ["python", "/opt/fetch.py"]
    volumes:
      - ${MODELS_PATH:-./compose-data/models}/music/heartmula:/ckpt
  diffrhythm2-weights:
    profiles: [music-weights]
    image: veritmo/diffrhythm2:${VERSION:-dev}
    user: *user
    environment: {HOME: /tmp}
    entrypoint: ["python", "/opt/fetch.py"]
    volumes:
      - ${MODELS_PATH:-./compose-data/models}/music/diffrhythm2:/ckpt

  # ─── Profile `model3d`: the 3D model generator ──────────────────────────
  # TripoSR (MIT) makes a 3D model from a picture; Stable Fast 3D is only in the image when it is built with SF3D=1 and SF3D_LICENCE=stability-community, which says you accepted its licence (see docker/model3d/README.md). The
  # weights are a folder of this machine (MODELS_PATH/model3d), mounted read-only. The server finds the service by MODEL3D_HOST and asks for the music token.
  #   docker compose --profile model3d-weights run --rm model3d-weights            # about 1.9 GB, once (TripoSR, no account)
  #   docker compose --profile model3d up -d
  # It takes the card MODEL3D_GPU (0 by default).
  model3d:
    profiles: [model3d]
    image: veritmo/model3d:${VERSION:-dev}
    build:
      context: ./docker/model3d
    restart: "no"
    user: *user
    environment:
      MODEL3D_TOKEN_FILE: /run/secrets/music_token
      HOME: /tmp
      # the user of the host has no entry in the image's passwd and torch asks for the user's name
      USER: app
    secrets: [music_token]
    volumes:
      - ${MODELS_PATH:-./compose-data/models}/model3d:/ckpt:ro
    tmpfs:
      - /tmp:exec,mode=1777
    shm_size: 1g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${MODEL3D_GPU:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; r = u.Request('http://127.0.0.1:8790/health', headers={'Authorization': 'Bearer ' + open('/run/secrets/music_token').read().strip()}); import sys; sys.exit(0 if u.urlopen(r, timeout=4).status == 200 else 1)"]
      interval: 20s
      timeout: 6s
      retries: 10
      start_period: 60s
    security_opt: ["no-new-privileges:true"]
  # The one-shot download of its weights (profile `model3d-weights`): it touches the network, only when asked. `sf3d` needs the Hugging Face key of an
  # account that has accepted its licence: docker compose --profile model3d-weights run --rm -e HF_TOKEN model3d-weights sf3d
  model3d-weights:
    profiles: [model3d-weights]
    image: veritmo/model3d:${VERSION:-dev}
    user: *user
    environment: {HOME: /tmp}
    entrypoint: ["python", "/opt/fetch.py"]
    volumes:
      - ${MODELS_PATH:-./compose-data/models}/model3d:/ckpt

  # ─── Profile `local-llm`: Ollama ────────────────────────────────────────
  # The language model of the assistant (prompts, descriptions, scene writer). Its models are a folder of this machine (OLLAMA_PATH), so they survive
  # the container being recreated. The server already points at it (OLLAMA_HOST); pull a model with
  #   docker compose --profile local-llm exec ollama ollama pull qwen3:8b
  # To use an Ollama that is somewhere else, set OLLAMA_HOST in .env and leave this profile off.
  ollama:
    profiles: [local-llm]
    <<: *gpu
    image: ollama/ollama:0.40.15
    restart: "no"
    user: *user
    environment:
      OLLAMA_MODELS: /models
      HOME: /tmp
    volumes:
      - ${OLLAMA_PATH:-./compose-data/ollama}:/models
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt: ["no-new-privileges:true"]

  # ─── Profile `redis`: the Redis of the Monitoring card ──────────────────
  # Only there so the card's test of Redis has something to answer: the server keeps nothing in it.
  redis:
    profiles: [redis]
    image: redis:7.4-alpine
    restart: "no"
    command: ["sh", "-c", "exec redis-server --requirepass \"$$(cat /run/secrets/redis_password)\" --save '' --appendonly no"]
    secrets: [redis_password]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]

  # ─── Profile `logs`: Loki and the shipper of the logs ───────────────────
  # Loki keeps the logs of the stack for 30 days; Alloy reads them from the Docker socket and sends them, and Grafana gets Loki as a data source
  # (when Grafana starts with Loki on the network: starting this profile later needs `docker compose up -d --force-recreate grafana`).
  # The socket is mounted read-only, which does not make the Docker API read-only: whatever has it can read every container's logs and environment.
  loki:
    profiles: [logs]
    image: grafana/loki:3.5.0
    restart: "no"
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./deploy/compose/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready | grep -q ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1g
    security_opt: ["no-new-privileges:true"]

  alloy:
    profiles: [logs]
    image: grafana/alloy:v1.10.0
    restart: "no"
    user: root
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    depends_on:
      loki: {condition: service_healthy}
    volumes:
      - ./deploy/compose/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 512m
    security_opt: ["no-new-privileges:true"]

  # ─── Watching it ────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: "no"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    secrets: [veritmo_token]
    volumes:
      - ./deploy/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      server: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    security_opt: ["no-new-privileges:true"]

  grafana:
    image: grafana/grafana:12.2.0
    restart: "no"
    depends_on:
      mysql-users: {condition: service_completed_successfully}
      prometheus: {condition: service_healthy}
      loki: {condition: service_healthy, required: false}
    environment:
      # Its own state lives in the MySQL of the stack, in its own schema: there is no SQLite file of Grafana.
      GF_DATABASE_TYPE: mysql
      GF_DATABASE_HOST: mysql:3306
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD__FILE: /run/secrets/grafana_db_password
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      VERITMO_DB_NAME: ${VERITMO_DB_NAME:-veritmo}
      GRAFANA_RO_PASSWORD_FILE: /run/secrets/grafana_ro_password
    secrets: [grafana_db_password, grafana_admin_password, grafana_ro_password]
    ports:
      - "${BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/compose/grafana/provisioning:/etc/provisioning-src:ro
      - ./docs/grafana:/dashboards-src:ro
    # The dashboards of docs/grafana are made to be imported (their data sources are inputs); here they are provisioned with fixed data source ids,
    # so the one copy of each file is used as it is and only the two ids are filled in as they are copied.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /etc/grafana/provisioning /var/lib/grafana/dashboards
        cp -r /etc/provisioning-src/. /etc/grafana/provisioning/
        # Loki is a data source only when it is on the network (profile `logs`)
        if nslookup loki >/dev/null 2>&1; then cp /etc/provisioning-src/datasources/loki.yml.optional /etc/grafana/provisioning/datasources/loki.yml; fi
        # the read-only password is read from its secret into the data source, which Grafana expands from the environment
        export GRAFANA_RO_PASSWORD="$$(cat "$$GRAFANA_RO_PASSWORD_FILE")"
        for f in /dashboards-src/*.json; do
          sed -e 's/\$${DS_MYSQL}/mysql/g' -e 's/\$${DS_PROMETHEUS}/prometheus/g' "$$f" > "/var/lib/grafana/dashboards/$$(basename "$$f")"
        done
        exec /run.sh
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1g
    security_opt: ["no-new-privileges:true"]

secrets:
  # Given by the person in .env (compose-init.sh makes them) and handed to the services as files under /run/secrets; they stay on this machine.
  mysql_root_password:
    environment: MYSQL_ROOT_PASSWORD
  veritmo_db_password:
    environment: VERITMO_DB_PASSWORD
  grafana_db_password:
    environment: GRAFANA_DB_PASSWORD
  grafana_ro_password:
    environment: GRAFANA_RO_PASSWORD
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD
  music_token:
    environment: MUSIC_TOKEN
  redis_password:
    environment: REDIS_PASSWORD
  veritmo_token:
    environment: VERITMO_TOKEN

volumes:
  mysql-data:
  prometheus-data:
  loki-data:

